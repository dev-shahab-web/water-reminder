apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

evaluationDependsOn(':app')

android {
    namespace 'com.shahab.waterreminder.wear'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.shahab.waterreminder'
        minSdk 30
        targetSdk 36
        versionCode 1000010
        versionName '1.0.0'
        if (findProperty('waterReminderSyncValidation') == 'true') {
            applicationIdSuffix '.syncvalidation'
            versionNameSuffix '-syncvalidation'
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.java.srcDir('../wear-protocol')
    sourceSets.main.assets.srcDir('../assets/fonts')
    signingConfigs {
        debug {
            storeFile project(':app').file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def phone = project(':app').android.signingConfigs.release
            storeFile phone.storeFile
            storePassword phone.storePassword
            keyAlias phone.keyAlias
            keyPassword phone.keyPassword
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    // Latest stable Wear Compose line compatible with the phone's API 36 toolchain.
    implementation 'androidx.wear.compose:compose-material3:1.6.2'
    implementation 'androidx.wear.compose:compose-foundation:1.6.2'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.wear:wear:1.4.0'
    implementation 'androidx.wear:wear-remote-interactions:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'androidx.wear.tiles:tiles:1.6.2'
    implementation 'androidx.concurrent:concurrent-futures:1.3.0'
    implementation 'androidx.wear.protolayout:protolayout-material3:1.4.2'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
